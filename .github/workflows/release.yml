# Builds cross-platform binaries for every cmd/* package.
#
# Tag push (v*): builds all platforms, generates SHA256 checksums, and creates
#   a GitHub Release with release notes.
# workflow_dispatch: builds only the Windows amd64 coach binary, uploads it as
#   a workflow artifact (no Release created). Useful for manual testing without
#   cutting a tag.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed for gh-release on tag push

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Resolve the version string from the tag or, on dispatch, from go.mod +
      # short commit hash, and write it to dist/VERSION for inclusion in the
      # artifact alongside checksums.
      - id: vars
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^go //p' go.mod)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      # Build the tag-release matrix for all platforms.
      - name: Build all platforms (tag)
        if: steps.vars.outputs.tag != ''
        run: |
          mkdir -p dist
          for cmd in cmd/*/; do
            name=$(basename "$cmd")
            GOOS=linux  GOARCH=amd64 go build -o "dist/${name}-linux-amd64"       "./${cmd%/}"
            GOOS=linux  GOARCH=arm64 go build -o "dist/${name}-linux-arm64"       "./${cmd%/}"
            GOOS=darwin GOARCH=amd64 go build -o "dist/${name}-darwin-amd64"      "./${cmd%/}"
            GOOS=darwin GOARCH=arm64 go build -o "dist/${name}-darwin-arm64"      "./${cmd%/}"
            GOOS=windows GOARCH=amd64 go build -o "dist/${name}-windows-amd64.exe" "./${cmd%/}"
          done

      - name: Build coach windows amd64 (dispatch)
        if: steps.vars.outputs.tag == ''
        run: |
          mkdir -p dist
          go build -o "dist/coach-windows-amd64.exe" ./cmd/coach

      - name: Write version manifest
        run: |
          cat > dist/VERSION <<'VEOF'
          version=${{ steps.vars.outputs.version }}
          commit=${{ github.sha }}
          go_module=gwentcoachmvp
          VEOF

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Generate release notes (tag)
        if: steps.vars.outputs.tag != ''
        id: notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## Gwent Coach ${{ steps.vars.outputs.tag }}" >> $GITHUB_OUTPUT
          echo >> $GITHUB_OUTPUT
          echo "Binaries for all platforms. See the [repository](https://github.com/infdahai/gwent-coach) for changelog and documentation." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v3
        if: steps.vars.outputs.tag != ''
        with:
          files: dist/*
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true

      - uses: actions/upload-artifact@v7
        if: steps.vars.outputs.tag == ''
        with:
          name: coach-windows-amd64
          path: dist/*
          if-no-files-found: error
